  <circle cx="100" cy="100" r="96" fill="#C41E3A"/>
  <circle cx="100" cy="100" r="82" fill="#FFF5F7"/>
  <!-- Face -->
  <ellipse cx="100" cy="108" rx="48" ry="42" fill="#F4C27A"/>
